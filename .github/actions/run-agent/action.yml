name: Run agent
description: >
  1サイクル分の1ロール（dev / feedback / slides）を、設定されたエージェント
  （claude または codex）で実行し、結果をコミットする。
  両エージェントには完全に同一のプロンプト文字列を渡す。

inputs:
  role:
    description: "dev | feedback | slides"
    required: true
  agent:
    description: "claude | codex"
    required: true
  cycle:
    description: "現在のサイクル番号"
    required: true
  max-cycles:
    description: "総サイクル数"
    required: true
  model:
    description: "このロール・このエージェント用に解決済みのモデルID"
    required: true
  codex-effort:
    description: "Codex の reasoning effort"
    required: false
    default: "high"
  max-turns:
    description: "Claude Code の最大ターン数"
    required: false
    default: "40"
  claude-code-oauth-token:
    description: "Claude Pro/Max のサブスク枠で実行する場合のトークン（`claude setup-token` で発行）"
    required: false
    default: ""
  anthropic-api-key:
    description: "OAuth トークンが無い場合のフォールバック（従量課金）"
    required: false
    default: ""
  openai-api-key:
    required: false
    default: ""
  github-token:
    description: "コミット/プッシュ用トークン（claude-code-action の OIDC 経路回避にも使用）"
    required: true
  branch:
    description: "成果を push する作業ブランチ（main には直接 push しない）"
    required: true

runs:
  using: composite
  steps:
    # ------------------------------------------------------------------
    # 1. プロンプトを組み立てる（claude / codex に同一文字列を渡すため共通化）
    # ------------------------------------------------------------------
    - name: Build prompt
      id: prompt
      shell: bash
      env:
        ROLE: ${{ inputs.role }}
        CYCLE: ${{ inputs.cycle }}
        MAX_CYCLES: ${{ inputs.max-cycles }}
      run: |
        set -euo pipefail
        SRC="prompts/${ROLE}.md"
        if [ ! -f "$SRC" ]; then
          echo "::error::prompt file not found: $SRC"
          exit 1
        fi
        {
          echo "text<<AGENT_PROMPT_EOF"
          sed -e "s/{{CYCLE}}/${CYCLE}/g" -e "s/{{MAX_CYCLES}}/${MAX_CYCLES}/g" "$SRC"
          echo "AGENT_PROMPT_EOF"
        } >> "$GITHUB_OUTPUT"

    # ------------------------------------------------------------------
    # 2. 認証情報の正規化
    #    シークレット登録時に紛れ込んだ前後の空白・改行を取り除く。
    #    改行を含む値は HTTP ヘッダに入れられないため、Claude Code は
    #    API を呼ぶ前にローカルで
    #      API Error: Header 'Authorization' has invalid value
    #    を返して即死する（実際にこれで1サイクルを失った）。
    # ------------------------------------------------------------------
    - name: Normalize credentials
      id: creds
      shell: bash
      env:
        OAUTH: ${{ inputs.claude-code-oauth-token }}
        ANTHROPIC: ${{ inputs.anthropic-api-key }}
        OPENAI: ${{ inputs.openai-api-key }}
      run: |
        set -euo pipefail
        emit() {
          # $1=出力名 $2=値。改行・復帰・前後空白を除去したうえで、
          # 加工後の値も必ずマスク登録してからログに出しうる場所へ渡す。
          local name="$1" value
          value="$(printf '%s' "$2" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -n "$value" ]; then
            echo "::add-mask::${value}"
            if [ "$value" != "$2" ]; then
              echo "::warning::シークレット ${name} に余分な空白／改行が含まれていたため除去しました。gh secret set し直すことを推奨します。"
            fi
          fi
          echo "${name}=${value}" >> "$GITHUB_OUTPUT"
        }
        emit oauth     "${OAUTH:-}"
        emit anthropic "${ANTHROPIC:-}"
        emit openai    "${OPENAI:-}"

    # ------------------------------------------------------------------
    # 3. エージェント実行（どちらか一方だけが走る）
    # ------------------------------------------------------------------
    - name: Run Claude Code
      if: inputs.agent == 'claude'
      uses: anthropics/claude-code-action@v1
      with:
        # 渡さないと action が OIDC → GitHub App トークン交換の経路に入り、
        # `id-token: write` 権限と Claude GitHub App の導入が必須になる。
        # ここは GITHUB_TOKEN（contents: write のみ）を明示的に渡して回避する。
        github_token: ${{ inputs.github-token }}
        claude_code_oauth_token: ${{ steps.creds.outputs.oauth }}
        anthropic_api_key: ${{ steps.creds.outputs.anthropic }}
        prompt: ${{ steps.prompt.outputs.text }}
        claude_args: |
          --model ${{ inputs.model }}
          --max-turns ${{ inputs.max-turns }}
          --allowedTools Read,Write,Edit,Glob,Grep,Bash

    - name: Run Codex
      if: inputs.agent == 'codex'
      uses: openai/codex-action@v1
      with:
        openai-api-key: ${{ steps.creds.outputs.openai }}
        prompt: ${{ steps.prompt.outputs.text }}
        permission-profile: ":workspace"
        safety-strategy: drop-sudo
        model: ${{ inputs.model }}
        effort: ${{ inputs.codex-effort }}

    # ------------------------------------------------------------------
    # 4. 保護パスへの変更を破棄（自己改変によるループ暴走の防止）
    # ------------------------------------------------------------------
    - name: Revert protected paths
      shell: bash
      run: |
        set -euo pipefail
        PROTECTED=(.github prompts AGENTS.md docs/evaluation.md docs/product-brief.md experiment.json metrics)
        DIRTY=0
        for p in "${PROTECTED[@]}"; do
          if ! git diff --quiet -- "$p" 2>/dev/null || \
             [ -n "$(git ls-files --others --exclude-standard -- "$p")" ]; then
            DIRTY=1
            echo "::warning::protected path modified by agent, reverting: $p"
          fi
        done
        if [ "$DIRTY" -eq 1 ]; then
          git checkout -- "${PROTECTED[@]}" 2>/dev/null || true
          git clean -fd -- "${PROTECTED[@]}" 2>/dev/null || true
          echo "PROTECTED_PATH_VIOLATION=1" >> "$GITHUB_ENV"
        fi

    # ------------------------------------------------------------------
    # 5. コミット & プッシュ
    # ------------------------------------------------------------------
    - name: Commit and push
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        ROLE: ${{ inputs.role }}
        AGENT: ${{ inputs.agent }}
        CYCLE: ${{ inputs.cycle }}
        BRANCH: ${{ inputs.branch }}
      run: |
        set -euo pipefail
        git config user.name "loop-bot"
        git config user.email "loop-bot@users.noreply.github.com"
        git add -A
        if git diff --cached --quiet; then
          echo "::notice::no changes produced by ${AGENT} (${ROLE}, cycle ${CYCLE})"
          exit 0
        fi
        git commit -m "cycle ${CYCLE}: ${ROLE} by ${AGENT}"

        # 直列実行なので競合はまず起きないが、起きた場合に静かに壊れないよう
        # rebase してリトライする（失敗はジョブ失敗として表面化させる）。
        REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        for i in 1 2 3; do
          if git push "$REMOTE" "HEAD:${BRANCH}"; then
            exit 0
          fi
          echo "::warning::push rejected (attempt ${i}), rebasing onto ${BRANCH}"
          git fetch "$REMOTE" "${BRANCH}"
          git rebase FETCH_HEAD
        done
        echo "::error::failed to push after 3 attempts"
        exit 1
