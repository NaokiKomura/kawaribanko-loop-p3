<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fffaf3" />
    <title>かわりばんこ — 開発チームの交換日記</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="hero">
        <p class="eyebrow">DEVELOPMENT TEAM DIARY</p>
        <h1>かわりばんこ</h1>
        <p id="subtitle" class="subtitle">開発チームの交換日記</p>
      </header>

      <section class="notebook" aria-labelledby="entries-heading">
        <div class="notebook-heading">
          <div>
            <p class="section-label">みんなのページ</p>
            <h2 id="entries-heading">日記を読む</h2>
          </div>
          <p id="entry-count" class="entry-count" aria-live="polite"></p>
        </div>

        <nav id="member-filter" class="member-filter" aria-label="書き手で絞り込む"></nav>
        <p id="filter-message" class="filter-message" hidden aria-live="polite"></p>
        <div id="entry-list" class="entry-list" aria-live="polite" aria-busy="true"></div>
      </section>

      <footer>
        <p>一冊の日記を、順番に。読み終えたら、次の人へ。</p>
      </footer>
    </main>
    <script src="app.js"></script>
  </body>
</html>
